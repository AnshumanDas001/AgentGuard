[project]
name = "agentguard"
version = "0.1.0"
description = "A pre-execution safety monitor for LLM agents, with pluggable guard backends."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.70",
    "httpx>=0.27",
    "openpyxl>=3.1.5",
    "pydantic>=2.7",
]

[dependency-groups]
bench = [
    "inspect-ai>=0.3.291",
    "pyarrow>=26.0.1",
]
dashboard = [
    "streamlit>=1.40",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]
ml = [
    "protobuf>=7.36.2",
    "sentencepiece>=0.2.3",
    "torch>=2.15.0",
    "transformers>=5.23.0",
]
report = [
    "matplotlib>=3.11.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentguard"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# Regex tables read best one pattern per line.
"agentguard/guard/backends/rules.py" = ["E501"]
